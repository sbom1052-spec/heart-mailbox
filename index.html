<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4050 김포/인천 싱글모임 | 비밀 고백게시판</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>

:root {
  --pink:#f45ca6;
  --deep:#a52c70;
  --ink:#302044;
  --line:#ffc1df;
}

* { box-sizing:border-box; }

html,body {
  margin:0;
  min-height:100%;
}

body {
  font-family:"Pretendard",sans-serif;
  color:var(--ink);
  background:#ffd9e9 url("background_blossom_gold.png") center top/100% auto no-repeat;
}

.page {
  width:min(1170px,calc(100% - 40px));
  margin:0 auto;
  padding:0 0 24px;
}

/* 상단 배경 */
.hero {
  height:280px;
  width:100vw;
  margin-left:calc((1170px - 100vw)/2);
}

/* 고백 작성 영역 */
.composer {
  position:relative;
  min-height:136px;
  margin:0 0 11px;
  padding:20px 30px 13px;
  background:rgba(255,255,255,.97);
  border:1.5px solid #ff9dce;
  border-radius:17px;
  box-shadow:0 3px 12px rgba(221,89,153,.12);
}

.composer::before {
  content:"♥  익명으로 마음 전하기";
  position:absolute;
  left:26px;
  top:-17px;
  width:108px;
  height:34px;
  background:linear-gradient(135deg,#ff79b7,#f34c9e);
  border-radius:7px;
  color:#fff;
  font-size:14px;
  font-weight:800;
  text-align:center;
  line-height:34px;
}

.composer-top {
  display:grid;
  grid-template-columns:105px minmax(0,275px) minmax(0,175px);
  gap:12px;
  align-items:center;
  margin-bottom:9px;
}

.field-label {
  font-size:14px;
  font-weight:800;
  color:#8e245e;
  white-space:nowrap;
}

.field-label:before {
  content:"♥";
  color:#f04e9b;
  font-size:17px;
  margin-right:7px;
}

#target,#postPassword {
  width:100%;
  min-width:0;
  height:35px;
  padding:7px 11px;
  border:1px solid #cfc6d2;
  border-radius:6px;
  background:#fff;
  font:13px "Pretendard",sans-serif;
  color:var(--ink);
}

.composer-bottom {
  display:grid;
  grid-template-columns:105px minmax(0,1fr) 130px;
  gap:12px;
  align-items:center;
}

#content {
  width:100%;
  height:43px;
  min-height:43px;
  resize:vertical;
  padding:10px 14px;
  border:1.5px solid #ffadd3;
  border-radius:8px;
  background:#fff;
  font:14px "Pretendard",sans-serif;
  line-height:1.5;
  color:var(--ink);
}

input:focus,textarea:focus {
  outline:2px solid #ffd0e6;
  border-color:#f45ca6;
}

::placeholder { color:#a69aaa; }

.submit {
  height:60px;
  border:0;
  border-radius:13px;
  background:linear-gradient(135deg,#ff80bb,#f24d9d);
  box-shadow:0 3px 0 #e9a0c5;
  color:white;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}

button {
  font-family:inherit;
  cursor:pointer;
}

button:disabled {
  opacity:.55;
  cursor:wait;
}

.status {
  min-height:16px;
  margin-top:5px;
  text-align:center;
  color:#b52e70;
  font-size:12px;
}

/* 관리자 로그인 */
.admin-area {
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:8px;
  margin:12px 0;
  min-height:34px;
}

.admin-status {
  font-size:12px;
  color:#9a7b91;
}

.admin-login-button,
.admin-logout-button {
  padding:8px 14px;
  border:1px solid #f2a5c9;
  border-radius:8px;
  background:#fff0f7;
  color:#d32d7d;
  font-size:12px;
  font-weight:800;
}

.admin-logout-button {
  border-color:#ddd;
  background:#fff;
  color:#777;
}

/* 게시글 */
.posts {
  display:grid;
  gap:9px;
}

.post {
  min-height:139px;
  display:grid;
  grid-template-columns:48px minmax(0,1fr);
  gap:10px;
  padding:14px 24px 11px;
  background:rgba(255,255,255,.98);
  border:1px solid #ffc0df;
  border-radius:16px;
  box-shadow:0 3px 12px rgba(215,105,157,.12);
}

.heart-count {
  width:42px;
  height:42px;
  margin-top:1px;
  border-radius:50%;
  background:#ffe0ef;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#ed3994;
  font-size:27px;
  font-weight:900;
}

.post-main { min-width:0; }

.post-head {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin:1px 0 4px;
}

.target-name {
  font-size:17px;
  font-weight:800;
  color:#38203e;
}

.date {
  font-size:12px;
  color:#8f829c;
  white-space:nowrap;
}

.post-content {
  white-space:pre-wrap;
  font-size:15px;
  line-height:1.55;
  margin:0 0 7px;
  overflow-wrap:anywhere;
}

.post-actions {
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:8px;
  margin:4px 0;
}

.delete-button {
  border:1px solid #f4c5dc;
  background:#fff7fb;
  color:#a56b89;
  border-radius:6px;
  font-size:11px;
  padding:5px 9px;
}

.admin-delete-button {
  border:1px solid #f2a5c9;
  background:#fff0f7;
  color:#d32d7d;
  border-radius:6px;
  font-size:11px;
  font-weight:800;
  padding:5px 10px;
}

.delete-button:hover,
.admin-delete-button:hover {
  background:#ffe0ef;
}

/* 댓글 */
.comments {
  margin:5px 0 6px;
  padding:0;
}

.comment {
  padding:7px 0;
  border-bottom:1px solid #f8e1ed;
}

.comment:last-child { border:0; }

.comment-top {
  display:flex;
  justify-content:space-between;
  color:#9c3972;
  font-size:11px;
  margin-bottom:3px;
}

.comment-content {
  font-size:12px;
  line-height:1.5;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.comment-actions { text-align:right; }

.comment-area {
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
  margin-top:5px;
}

.comment-count {
  font-size:12px;
  color:#8d8299;
  white-space:nowrap;
}

.comment-count:before {
  content:"▣";
  margin-right:5px;
}

.comment-form {
  display:grid;
  grid-template-columns:minmax(0,1fr) 155px auto;
  gap:6px;
  flex:1;
  min-width:0;
}

.comment-form input {
  min-width:0;
  width:100%;
  height:33px;
  padding:7px 12px;
  border:1px solid #f5c4dc;
  border-radius:7px;
  background:#fff3f9;
  font:12px "Pretendard",sans-serif;
}

.comment-form button {
  height:33px;
  padding:0 17px;
  border:0;
  border-radius:10px;
  background:#f66bab;
  color:white;
  font-size:12px;
  font-weight:800;
}

.empty {
  text-align:center;
  padding:35px;
  background:#fff;
  border:1px solid #ffc0df;
  border-radius:16px;
  color:#9b7c91;
}

.footer {
  text-align:center;
  padding:37px 0 5px;
  color:#c33b80;
  font:700 20px "Gaegu",cursive;
}
.footer-last-line {
  display:inline;
}

/* 모바일 */
@media(max-width:1170px) {
  .hero { margin-left:-20px; }
}

@media(max-width:700px) {
  .page { width:calc(100% - 24px); }
  .footer-last-line { display:block; }

  .hero {
    height:175px;
    margin-left:-12px;
    width:100vw;
  }

  .composer {
    padding:20px 14px 15px;
    min-height:0;
  }

  .composer::before {
    left:12px;
    top:-16px;
    width:104px;
    height:32px;
    font-size:13px;
    line-height:32px;
  }

  .composer-top {
    grid-template-columns:105px minmax(0,1fr);
    gap:7px;
    margin-bottom:9px;
  }

  #postPassword {
    grid-column:2;
    width:100%;
  }

  .composer-bottom {
    grid-template-columns:105px minmax(0,1fr);
    gap:7px;
  }

  .composer-bottom .submit {
    grid-column:1 / -1;
  }

  #content {
    height:55px;
    min-height:55px;
  }

  .submit { height:48px; }

  .post {
    grid-template-columns:40px minmax(0,1fr);
    gap:8px;
    padding:13px 12px;
    min-height:0;
  }

  .heart-count {
    width:36px;
    height:36px;
    font-size:19px;
  }

  .comment-area { flex-wrap:wrap; }

  .comment-form {
    flex-basis:100%;
    grid-template-columns:minmax(0,1fr) 115px auto;
  }

  .post-head {
    align-items:flex-start;
  }
}

@media(max-width:420px) {
  .hero { height:175px; }

  .post-head {
    flex-direction:column;
    gap:3px;
  }

  .post-content { font-size:14px; }

  .comment-form {
    grid-template-columns:minmax(0,1fr) 100px auto;
  }
}


/* 댓글 접기/펼치기 */
.comment-toggle-row {
  display:flex;
  justify-content:flex-end;
  align-items:center;
  margin:7px 0 4px;
}
.comment-toggle {
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 10px;
  border:1px solid #f5bfd9;
  border-radius:8px;
  background:#fff5fa;
  color:#b52e70;
  font-size:12px;
  font-weight:800;
}
.comment-toggle .arrow {
  display:inline-block;
  width:0;height:0;
  border-left:4px solid transparent;
  border-right:4px solid transparent;
  border-top:5px solid currentColor;
  transition:transform .18s ease;
}
.comment-toggle[aria-expanded="true"] .arrow { transform:rotate(180deg); }
.comment-panel { display:none; margin-top:4px; }
.comment-panel.open { display:block; }
.comment-empty {
  padding:9px 0;
  color:#a58b9b;
  font-size:12px;
}
.comment-status {
  min-height:15px;
  margin-top:3px;
  color:#b52e70;
  font-size:11px;
}
@media(max-width:700px) {
  .comment-form { grid-template-columns:minmax(0,1fr) 105px auto; }
}


/* 고백 입력 배치: 비밀번호는 고백 내용 옆, 내용 입력창은 제목 아래 */
.composer { padding:22px 30px 14px; }
.composer-top {
  display:grid;
  grid-template-columns:105px minmax(0,330px);
  gap:10px;
  margin-bottom:12px;
}
.composer-bottom {
  display:grid;
  grid-template-columns:105px minmax(0,1fr) 125px;
  grid-template-rows:auto auto;
  column-gap:10px;
  row-gap:7px;
  align-items:start;
}
.confession-label-wrap {
  grid-column:1 / 3;
  grid-row:1;
  display:grid;
  grid-template-columns:105px minmax(0,1fr);
  gap:10px;
  align-items:center;
}
.confession-label-wrap .field-label { white-space:nowrap; }
.confession-label-wrap #postPassword {
  width:145px;
  height:28px;
  padding:5px 8px;
  font-size:12px;
  justify-self:start;
}
#content {
  grid-column:1 / 3;
  grid-row:2;
  width:100%;
  height:68px;
  min-height:68px;
  margin:0;
}
.composer-bottom .submit {
  grid-column:3;
  grid-row:1 / 3;
  height:103px;
}
/* 관리자 메뉴는 게시판 맨 아래에만 표시 */
.admin-area {
  justify-content:center;
  margin:18px 0 4px;
  min-height:30px;
}
.admin-status { display:none; }
/* 댓글 입력: 비밀번호는 위쪽 왼편, 댓글 입력은 아래쪽으로 길게 */
.comment-form {
  display:flex;
  flex-direction:column;
  gap:6px;
  width:100%;
  margin-top:10px;
}
.comment-form .comment-password-wrap {
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  width:125px;
}
.comment-form input[name="password"] {
  width:125px;
  height:27px;
  padding:5px 8px;
  font-size:11px;
}
.comment-form input[name="comment"] {
  width:100%;
  height:38px;
  background:#fff;
  font-size:13px;
}
.comment-form button {
  align-self:flex-end;
  min-width:76px;
}
@media(max-width:700px) {
  .composer { padding:20px 14px 14px; }
  .composer-top { grid-template-columns:95px minmax(0,1fr); }
  .composer-bottom {
    grid-template-columns:95px minmax(0,1fr);
    grid-template-rows:auto auto auto;
    gap:7px;
  }
  .confession-label-wrap {
    grid-column:1 / 3;
    grid-row:1;
    grid-template-columns:95px minmax(0,1fr);
    gap:7px;
  }
  .confession-label-wrap #postPassword { width:125px; }
  #content {
    grid-column:1 / 3;
    grid-row:2;
    height:72px;
    min-height:72px;
  }
  .composer-bottom .submit {
    grid-column:1 / 3;
    grid-row:3;
    height:45px;
  }
}

/* 관리자 모드: 테두리/배경 네모칸 제거, 최대한 은은하게 표시 */
.admin-area {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  margin:18px 0 4px;
  min-height:22px;
  opacity:.28;
  transition:opacity .2s ease;
}
.admin-area:hover,
.admin-area:focus-within { opacity:.75; }
.admin-login-button,
.admin-logout-button {
  appearance:none;
  padding:2px 4px;
  border:0 !important;
  outline:0;
  border-radius:0 !important;
  background:transparent !important;
  box-shadow:none !important;
  color:#956f83 !important;
  font-size:10px;
  font-weight:500;
  cursor:pointer;
}
.admin-login-button:hover,
.admin-logout-button:hover {
  color:#75465f !important;
  text-decoration:underline;
}


/* 화면별 게시판 전체 위치 조정 */
@media (min-width:701px) {
  .composer {
    margin-top:280px !important; /* PC: 숫자를 바꿔 이동 거리 조절 */
  }
}

@media (max-width:700px) {
  .composer {
    margin-top:5px !important; /* 모바일: 숫자를 바꿔 이동 거리 조절 */
  }
}



/* 게시물삭제·댓글삭제·관리자삭제 버튼: 네모 없이 같은 글자 스타일 */
.post { position:relative; }
.post-actions {
  position:absolute;
  top:10px;
  right:18px;
  z-index:2;
  margin:0;
  gap:9px;
}
.post-actions .delete-button,
.post-actions .admin-delete-button,
.comment-top .delete-button,
.comment-top .admin-delete-button {
  border:0 !important;
  outline:0 !important;
  background:transparent !important;
  box-shadow:none !important;
  border-radius:0 !important;
  padding:2px 0 !important;
  min-width:0 !important;
  height:auto !important;
  color:#a56b89 !important;
  font-size:11px !important;
  font-weight:400 !important;
  text-decoration:none !important;
}
.post-actions .delete-button:hover,
.post-actions .admin-delete-button:hover,
.comment-top .delete-button:hover,
.comment-top .admin-delete-button:hover {
  color:#bd286f !important;
  background:transparent !important;
  text-decoration:underline !important;
}
.post-head { padding-right:105px; }

/* 댓글 작성란: 댓글 입력칸은 왼쪽, 비밀번호는 오른쪽에 배치하고 게시글 카드 폭에 맞춤 */
.comment-form {
  display:grid !important;
  grid-template-columns:minmax(0,1fr) 105px auto;
  align-items:center;
  gap:7px;
  width:calc(100% + 94px);
  margin:9px 0 0 -94px;
}
.comment-form .comment-password-wrap {
  display:block;
  width:100%;
  grid-column:2;
  grid-row:1;
}
.comment-form .password-caption { display:none !important; }
.comment-form input[name="password"] {
  width:100%;
  height:34px;
  padding:5px 7px;
  font-size:11px;
}
.comment-form input[name="comment"] {
  grid-column:1;
  grid-row:1;
  width:100%;
  min-width:0;
  height:34px;
  background:#fff;
  font-size:13px;
}
.comment-form button {
  grid-column:3;
  grid-row:1;
  align-self:center;
  min-width:76px;
  height:34px;
}
/* 삭제 버튼은 표시하고, 실제 삭제 여부는 비밀번호로 확인 */
.comment-actions .delete-button,
.post-actions .delete-button { display:inline-block; }
@media(max-width:700px) {
  .post-actions { top:8px; right:10px; }
  .post-head { padding-right:82px; }
  .comment-form {
    grid-template-columns:minmax(0,1fr) 82px auto;
    width:calc(100% + 64px);
    margin-left:-64px;
  }
}

/* 고백하기 위 안내 문구 */
.confession-intro {
  width:fit-content;
  max-width:100%;
  margin:0 auto -150px;
  padding:10px 22px;
  border:1px solid rgba(255,255,255,.9);
  border-radius:999px;
  background:linear-gradient(135deg,rgba(255,255,255,.92),rgba(255,239,247,.88));
  box-shadow:0 5px 18px rgba(190,75,130,.13);
  color:#a52c70;
  font-family:"Gaegu","Pretendard",sans-serif;
  font-size:24px;
  font-weight:700;
  letter-spacing:.3px;
  text-align:center;
  position:relative;
  z-index:1;
}

/* 안내 문구 위치 - PC에서만 조정 */
@media (min-width:701px) {
  .confession-intro {
    top:110px; /* PC: 숫자를 바꾸어 위아래 위치 조정 */
  }
}

.confession-intro span {
  display:inline-block;
  margin-left:5px;
  color:#f45ca6;
  font-size:20px;
}

/* 안내 문구 위치 - 모바일에서만 조정 */
@media(max-width:700px) {
  .confession-intro {
    top:-90px; /* 모바일: 숫자를 바꾸어 위아래 위치 조정 */
    margin-bottom:-55px;
    padding:8px 14px;
    font-size:19px;
  }
}


/* 댓글 입력칸이 왼쪽 하트 원형 영역을 침범하지 않도록 post-main 안에 배치 */
.comment-form {
  display:grid !important;
  grid-template-columns:minmax(0,1fr) 105px 48px !important;
  align-items:center;
  gap:7px;
  width:calc(100% + 58px);
  margin:9px 0 0 -58px;
}
.comment-form input[name="comment"] {
  grid-column:1;
  grid-row:1;
  width:100%;
  min-width:0;
  height:36px;
}
.comment-form .comment-password-wrap {
  grid-column:2;
  grid-row:1;
  width:100%;
}
.comment-form input[name="password"] {
  width:100%;
  height:36px;
}
.comment-form button {
  grid-column:3;
  grid-row:1;
  width:48px;
  min-width:48px;
  height:36px;
  padding:0 5px;
  white-space:nowrap;
  font-size:12px;
}
.comment-toggle-row {
  display:flex;
  justify-content:flex-start;
  align-items:center;
  width:calc(100% + 58px);
  margin:6px 0 3px -58px;
}
.comment-toggle {
  padding:5px 9px;
  cursor:pointer;
}
.comment-panel { display:none; }
.comment-panel.open { display:block; }

@media(max-width:700px) {
  .comment-form {
    grid-template-columns:minmax(0,1fr) 82px 44px !important;
    width:calc(100% + 48px);
    margin-left:-48px;
    gap:5px;
  }
  .comment-form button {
    width:44px;
    min-width:44px;
    padding:0 4px;
  }

function readOwnerIds(key) {
  try { return new Set(JSON.parse(localStorage.getItem(key) || "[]").map(String)); }
  catch (_) { return new Set(); }

function saveOwnerId(key, id) {
  if (id === null || id === undefined || id === "") return;

  // Supabase RPC는 UUID, 객체, 배열 등 여러 형태로 값을 반환할 수 있음
  if (typeof data === "string" || typeof data === "number") return data;

    for (const value of Object.values(data)) {

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[char]));
}

/* 날짜 표시 */
function formatDate(value) {
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return "";
  return date.toLocaleString("ko-KR", {
    month:"long", day:"numeric", hour:"2-digit", minute:"2-digit"
  });
}

/* 댓글 ID를 기준으로 새로고침해도 바뀌지 않는 무작위 5글자 닉네임 */
function commentNickname(id) {
  const chars = Array.from("가나다라마바사아자차카타파하거너더러머버서어저처커터퍼허고노도로모보소오조초코토포호구누두루무부수우주추쿠투푸후");
  const seedText = String(id ?? "comment");
  let seed = 2166136261;
  for (let i = 0; i < seedText.length; i++) {
    seed ^= seedText.charCodeAt(i);
    seed = Math.imul(seed, 16777619);
  }
  let result = "";
  for (let i = 0; i < 5; i++) {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    result += chars[seed % chars.length];
  }
  return result;
}

function setAdminUI() {
  document.getElementById("adminStatus").textContent = isAdminMode ? "관리자 모드" : "일반 모드";
  document.getElementById("adminLoginButton").hidden = isAdminMode;
  document.getElementById("adminLogoutButton").hidden = !isAdminMode;

/* 관리자 로그인 */
async function adminLogin() {
  const password = prompt("관리자 마스터 비밀번호를 입력하세요.");
  if (password === null) return;
  if (!password) { alert("비밀번호를 입력해 주세요."); return; }

  try {
    const { data, error } = await db.rpc("admin_check_password", { p_password:password });
    if (error) throw error;
    if (data !== true) { alert("관리자 비밀번호가 일치하지 않습니다."); return; }
    isAdminMode = true;
    setAdminUI();
    alert("관리자 모드로 로그인했습니다.");
    await loadPosts();
  } catch (error) {
    console.error("관리자 로그인 오류:", error);
    alert("관리자 로그인에 실패했습니다.\n" + (error.message || "Supabase 설정을 확인해 주세요."));
  }
}

function adminLogout() {
  isAdminMode = false;
  setAdminUI();
  loadPosts();
}

document.getElementById("adminLoginButton").addEventListener("click", adminLogin);
document.getElementById("adminLogoutButton").addEventListener("click", adminLogout);

/* 게시글 등록 */
document.getElementById("confessionForm").addEventListener("submit", async function(event) {
  event.preventDefault();

  const target = document.getElementById("target").value.trim();
  const content = document.getElementById("content").value.trim();
  const password = document.getElementById("postPassword").value;
  if (!target || !content || password.length < 4) {
    formStatus.textContent = "닉네임, 고백 내용과 비밀번호(4자 이상)를 입력해 주세요.";
    return;
  }

  const button = document.getElementById("submitButton");
  button.disabled = true;
  formStatus.textContent = "고백을 등록하고 있습니다...";

  try {
    const { data:createdPost, error } = await db.rpc("create_confession", {
      p_target_nickname:target, p_content:content, p_password:password
    });
    if (error) throw error;

    // 함수가 ID를 반환하지 않는 경우 방금 등록한 글을 조회해 소유 표시를 저장
    console.log("게시글 등록 반환값:", createdPost);
    let newPostId = returnedId(createdPost);
    if (newPostId === null) {
      const { data:foundPost, error:findPostError } = await db.from("confessions").select("id")
        .eq("target_nickname", target).eq("content", content)
        .order("created_at", { ascending:false }).limit(1).maybeSingle();
      if (findPostError) console.error("게시글 ID 확인 오류:", findPostError);
      newPostId = foundPost?.id ?? null;
    }
    if (newPostId !== null) saveOwnerId(OWNER_POSTS_KEY, newPostId);

    this.reset();
    formStatus.textContent = "고백이 등록되었습니다. 💗";
    await loadPosts();
  } catch (error) {
    console.error("게시글 등록 오류:", error);
    formStatus.textContent = "등록 실패: " + (error.message || "Supabase 설정을 확인해 주세요.");
  } finally {
    button.disabled = false;
  }
});

/* 게시글 및 댓글 불러오기 */
async function loadPosts() {
  postList.innerHTML = '<div class="empty">고백을 불러오고 있습니다...</div>';

  const { data:posts, error } = await db
    .from("confessions")
    .select("id,target_nickname,content,created_at")
    .order("created_at", { ascending:false })
    .limit(100);

  if (error) {
    console.error("게시글 조회 오류:", error);
    postList.innerHTML = '<div class="empty">게시글을 불러오지 못했습니다. Supabase 테이블과 공개 조회 권한을 확인해 주세요.</div>';
    return;
  }

  if (!posts || posts.length === 0) {
    postList.innerHTML = '<div class="empty">아직 도착한 고백이 없어요.<br>첫 번째 마음을 전해보세요 💗</div>';
    return;
  }

  const ids = posts.map(post => post.id);
  const { data:comments, error:commentError } = await db
    .from("confession_comments")
    .select("id,confession_id,content,created_at")
    .in("confession_id", ids)
    .order("created_at", { ascending:true });

  if (commentError) console.error("댓글 조회 오류:", commentError);
  const safeComments = comments || [];

  postList.innerHTML = posts.map(post => {
    const list = safeComments.filter(comment => String(comment.confession_id) === String(post.id));
    const isOpen = openedCommentPosts.has(String(post.id));

    return `
      <article class="post">
        <div class="heart-count">♡</div>
        <div class="post-main">
          <div class="post-head">
            <span class="target-name">${escapeHTML(post.target_nickname)}</span>
            <span class="date">◷ ${escapeHTML(formatDate(post.created_at))}</span>
          </div>

          <p class="post-content">${escapeHTML(post.content)}</p>

          <div class="post-actions">
            ${readOwnerIds(OWNER_POSTS_KEY).has(String(post.id)) ? `<button class="delete-button" type="button" onclick="deletePost('${escapeHTML(post.id)}')">게시물삭제</button>` : ""}
            ${isAdminMode ? `<button class="admin-delete-button" type="button" onclick="adminDeletePost('${escapeHTML(post.id)}')">관리자 삭제</button>` : ""}
          </div>
<div class="comment-panel ${isOpen ? "open" : ""}" id="comment-panel-${escapeHTML(post.id)}">
            <div class="comments">
              ${list.length ? list.map(comment => `
                <div class="comment">
                  <div class="comment-top">
                    <span>${escapeHTML(commentNickname(comment.id))}</span>
                    ${readOwnerIds(OWNER_COMMENTS_KEY).has(String(comment.id)) ? `<button class="delete-button" type="button" onclick="deleteComment('${escapeHTML(comment.id)}')">댓글삭제</button>` : ""} 
                    ${isAdminMode ? `<button class="admin-delete-button" type="button" onclick="adminDeleteComment('${escapeHTML(comment.id)}')">관리자 댓글삭제</button>` : ""}
                  </div>
                  <div class="comment-content">${escapeHTML(comment.content)}</div>
                </div>
              `).join("") : '<div class="comment-empty">아직 댓글이 없습니다. 첫 댓글을 남겨보세요. 💗</div>'}
            </div>
          </div>

          <form class="comment-form" data-post-id="${escapeHTML(post.id)}">
            <div class="comment-password-wrap">
              <input name="password" type="password" minlength="4" maxlength="50"
                autocomplete="new-password" placeholder="비밀번호" required aria-label="댓글 비밀번호">
            </div>
            <input name="comment" maxlength="500" placeholder="익명으로 따뜻한 댓글을 남겨보세요..." required>
            <button type="submit">등록</button>
          </form>
          <div class="comment-toggle-row">
            <button class="comment-toggle" type="button"
              aria-expanded="${isOpen ? "true" : "false"}"
              aria-controls="comment-panel-${escapeHTML(post.id)}"
              data-toggle-comments="${escapeHTML(post.id)}">
              댓글 ${list.length}개 <span class="arrow" aria-hidden="true"></span>
            </button>
          </div>
          <div class="comment-status" aria-live="polite"></div>
        </div>
      </article>
    `;
  }).join("");

  document.querySelectorAll(".comment-form").forEach(form => {
    form.addEventListener("submit", addComment);
  });
}

/* 댓글 열기 / 닫기 */
function toggleComments(postId) {
  const id = String(postId);
  const isNowOpen = !openedCommentPosts.has(id);
  if (isNowOpen) openedCommentPosts.add(id);
  else openedCommentPosts.delete(id);

  // 버튼의 data 값으로 해당 댓글 영역을 찾아 표시 상태를 변경
  const button = [...postList.querySelectorAll("button[data-toggle-comments]")]
    .find(item => item.getAttribute("data-toggle-comments") === id);
  const panelId = button?.getAttribute("aria-controls");
  const panel = panelId ? document.getElementById(panelId) : null;

  if (panel) {
    panel.classList.toggle("open", isNowOpen);
    panel.style.display = isNowOpen ? "block" : "none";
  }
  if (button) {
    button.setAttribute("aria-expanded", isNowOpen ? "true" : "false");
  }
}

/* 댓글 등록 후 해당 게시글 댓글 영역 자동 열기 */
async function addComment(event) {
  event.preventDefault();
  const form = event.currentTarget;
  const postId = form.dataset.postId;
  const content = form.elements.comment.value.trim();
  const password = form.elements.password.value;

  if (!content || password.length < 4) {
    alert("댓글과 비밀번호(4자 이상)를 입력해 주세요.");
    return;
  }

  const button = form.querySelector("button[type='submit']");
  const status = form.parentElement.querySelector(".comment-status");
  button.disabled = true;
  status.textContent = "댓글을 등록하고 있습니다...";

  try {
    const { data:createdComment, error } = await db.rpc("create_comment", {
      p_confession_id:postId, p_content:content, p_password:password
    });
    if (error) throw error;

    console.log("댓글 등록 반환값:", createdComment);
    let newCommentId = returnedId(createdComment);
    if (newCommentId === null) {
      const { data:foundComment, error:findCommentError } = await db.from("confession_comments").select("id")
        .eq("confession_id", postId).eq("content", content)
        .order("created_at", { ascending:false }).limit(1).maybeSingle();
      if (findCommentError) console.error("댓글 ID 확인 오류:", findCommentError);
      newCommentId = foundComment?.id ?? null;
    }
    if (newCommentId !== null) saveOwnerId(OWNER_COMMENTS_KEY, newCommentId);

    openedCommentPosts.add(String(postId));
    await loadPosts();
  } catch (error) {
    console.error("댓글 등록 오류:", error);
    status.textContent = "댓글 등록 실패: " + (error.message || "다시 시도해 주세요.");
    button.disabled = false;
  }
}

/* 본인 게시글 삭제 */
async function deletePost(postId) {
  const password = prompt("게시글 작성 시 설정한 삭제 비밀번호를 입력해 주세요.");
  if (password === null) return;
  if (!password) { alert("비밀번호를 입력해 주세요."); return; }
  if (!confirm("이 게시글과 댓글을 모두 삭제할까요?")) return;

  try {
    const { data, error } = await db.rpc("delete_confession", {
      p_post_id:postId, p_password:password
    });
    if (error) throw error;
    if (data !== true) { alert("비밀번호가 일치하지 않거나 삭제할 수 없는 게시글입니다."); return; }
    openedCommentPosts.delete(String(postId));
    const ownedPosts = readOwnerIds(OWNER_POSTS_KEY); ownedPosts.delete(String(postId));
    try { localStorage.setItem(OWNER_POSTS_KEY, JSON.stringify([...ownedPosts])); } catch (_) {}
    alert("게시글이 삭제되었습니다.");
    await loadPosts();
  } catch (error) {
    console.error("게시글 삭제 오류:", error);
    alert("게시글 삭제 실패: " + (error.message || "다시 시도해 주세요."));
  }
}

/* 관리자 모드에서 댓글 하나만 별도로 삭제 */
async function adminDeleteComment(commentId) {
  if (!isAdminMode) { alert("관리자 로그인 후 이용해 주세요."); return; }
  if (!confirm("선택한 댓글만 삭제할까요? 게시글은 삭제되지 않습니다.")) return;

  const password = prompt("관리자 마스터 비밀번호를 다시 입력해 주세요.");
  if (password === null) return;
  if (!password) { alert("관리자 비밀번호를 입력해 주세요."); return; }

  try {
    const { data, error } = await db.rpc("admin_delete_comment", {
      p_comment_id: commentId,
      p_password: password
    });
    if (error) throw error;
    if (data !== true) {
      alert("관리자 비밀번호가 틀렸거나 댓글을 찾을 수 없습니다.");
      return;
    }
    alert("댓글이 삭제되었습니다.");
    await loadPosts();
  } catch (error) {
    console.error("관리자 댓글 삭제 오류:", error);
    alert("관리자 댓글 삭제 실패\\n" + (error.message || "Supabase의 admin_delete_comment 함수 설정을 확인해 주세요."));
  }
}

/* 관리자 게시글 및 해당 댓글 삭제 */
async function adminDeletePost(postId) {
  if (!isAdminMode) { alert("관리자 로그인 후 이용해 주세요."); return; }
  if (!confirm("선택한 게시글과 그 게시글의 댓글만 삭제합니다.\n\n계속하시겠습니까?")) return;

  const password = prompt("관리자 마스터 비밀번호를 다시 입력해 주세요.");
  if (password === null) return;
  if (!password) { alert("관리자 비밀번호를 입력해 주세요."); return; }

  try {
    const { data, error } = await db.rpc("admin_delete_one", {
      p_post_id:postId, p_password:password
    });
    if (error) throw error;
    if (data !== true) { alert("관리자 비밀번호가 틀렸거나 게시글을 찾을 수 없습니다."); return; }
    openedCommentPosts.delete(String(postId));
    alert("선택한 게시글과 댓글이 삭제되었습니다.");
    await loadPosts();
  } catch (error) {
    console.error("관리자 게시글 삭제 오류:", error);
    alert("관리자 삭제 실패\n" + (error.message || "Supabase 함수와 권한을 확인해 주세요."));
  }
}
