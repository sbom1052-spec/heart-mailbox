
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>익명 고백 게시판 💌</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 20px 14px 50px;
    font-family: Arial, "Malgun Gothic", sans-serif;
    background: #fff1f5;
    color: #49343d;
}

.container {
    max-width: 650px;
    margin: auto;
}

header {
    text-align: center;
    padding: 25px 10px;
}

header h1 {
    color: #e85d8b;
    font-size: 29px;
    margin: 0 0 10px;
}

header p {
    color: #9b7180;
    font-size: 14px;
    margin: 0;
}

.panel {
    background: white;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 4px 15px rgba(200, 100, 130, .08);
}

.panel h2 {
    margin: 0 0 16px;
    color: #df5684;
    font-size: 19px;
}

input, textarea {
    width: 100%;
    border: 1px solid #f2cbd8;
    border-radius: 10px;
    padding: 13px;
    font-size: 15px;
    margin-bottom: 10px;
    outline: none;
    background: #fffafd;
}

input:focus, textarea:focus {
    border-color: #e8789f;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

button {
    border: none;
    border-radius: 10px;
    padding: 11px 15px;
    cursor: pointer;
    font-size: 14px;
}

.main-btn {
    width: 100%;
    background: #e96d96;
    color: white;
    font-weight: bold;
    padding: 14px;
}

.main-btn:hover { background: #dc5785; }

.post {
    border: 1px solid #f5d9e2;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
    background: #fffafd;
}

.post-top {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: center;
    margin-bottom: 10px;
}

.nickname {
    color: #dc5684;
    font-weight: bold;
    font-size: 16px;
}

.date {
    font-size: 11px;
    color: #aa929b;
}

.post-content {
    white-space: pre-wrap;
    line-height: 1.65;
    overflow-wrap: anywhere;
    margin: 12px 0;
}

.small-btn {
    background: #fce5ed;
    color: #b94e75;
    padding: 7px 11px;
    font-size: 12px;
}

.comment-area {
    border-top: 1px solid #f4dce4;
    margin-top: 15px;
    padding-top: 13px;
}

.comment {
    background: #fff;
    border-radius: 9px;
    padding: 10px;
    margin: 8px 0;
    font-size: 13px;
}

.comment-row {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: flex-start;
}

.comment-text {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    line-height: 1.5;
}

.comment-date {
    color: #ad929d;
    font-size: 10px;
    margin-top: 5px;
}

.comment-form {
    margin-top: 12px;
}

.comment-form input {
    margin-bottom: 7px;
    padding: 10px;
    font-size: 13px;
}

.comment-form button {
    background: #f3a2bb;
    color: white;
}

.empty {
    text-align: center;
    color: #b99ba6;
    padding: 35px 10px;
    font-size: 14px;
}

.admin-area {
    text-align: center;
    margin-top: 25px;
}

.admin-btn {
    background: #806b76;
    color: white;
    font-size: 12px;
}

.notice {
    font-size: 12px;
    line-height: 1.6;
    color: #a58b96;
    margin-top: 12px;
}

.hidden { display: none; }
</style>
</head>

<body>
<div class="container">

<header>
    <h1>💌 익명 고백 게시판</h1>
    <p>마음속에 담아둔 이야기를 편하게 전해보세요.</p>
</header>

<section class="panel">
    <h2>💗 고백 게시글</h2>
    <div id="postList">
        <div class="empty">게시글을 불러오는 중입니다.</div>
    </div>
</section>

<section class="panel">
    <h2>✉️ 마음 전하기</h2>

    <input id="targetNickname"
           type="text"
           maxlength="30"
           placeholder="고백할 상대방 닉네임">

    <textarea id="postContent"
              maxlength="2000"
              placeholder="전하고 싶은 마음을 적어주세요."></textarea>

    <input id="postPassword"
           type="password"
           maxlength="100"
           placeholder="삭제 비밀번호 (4자리 이상)">

    <button class="main-btn" id="postSubmit">
        💌 고백 등록하기
    </button>

    <p class="notice">
        ※ 작성할 때 입력한 비밀번호로 본인의 게시글을 삭제할 수 있습니다.
        비밀번호를 잊어버리면 본인이 직접 삭제할 수 없습니다.
    </p>
</section>

<div class="admin-area">
    <button class="admin-btn" id="adminDelete">
        관리자 전체 게시글·댓글 삭제
    </button>
</div>

</div>

<script>
const SUPABASE_URL =
"https://vuvzchrhbdgtsfjoobrb.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_E0GSkkS2vp-oknFC9nfvAg_Ky-JhpBH";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

const postList = document.getElementById("postList");

function escapeText(value) {
    return String(value ?? "");
}

function formatDate(value) {
    if (!value) return "";
    return new Date(value).toLocaleString("ko-KR", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
    });
}

async function loadPosts() {
    postList.replaceChildren();

    const { data: posts, error } = await db
        .from("confessions")
        .select("id,target_nickname,content,created_at")
        .order("created_at", { ascending: false });

    if (error) {
        console.error(error);
        postList.textContent = "게시글을 불러오지 못했습니다. Supabase 설정과 권한을 확인해주세요.";
        return;
    }

    if (!posts || posts.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "아직 등록된 고백이 없습니다. 첫 번째 마음을 전해보세요 💗";
        postList.appendChild(empty);
        return;
    }

    for (const post of posts) {
        const card = document.createElement("article");
        card.className = "post";

        const top = document.createElement("div");
        top.className = "post-top";

        const nickname = document.createElement("span");
        nickname.className = "nickname";
        nickname.textContent = "💗 " + escapeText(post.target_nickname);

        const date = document.createElement("span");
        date.className = "date";
        date.textContent = formatDate(post.created_at);

        top.append(nickname, date);

        const content = document.createElement("div");
        content.className = "post-content";
        content.textContent = escapeText(post.content);

        const deleteButton = document.createElement("button");
        deleteButton.className = "small-btn";
        deleteButton.textContent = "게시글 삭제";
        deleteButton.addEventListener("click", () => deletePost(post.id));

        const commentArea = document.createElement("div");
        commentArea.className = "comment-area";

        const commentTitle = document.createElement("strong");
        commentTitle.textContent = "💬 댓글";

        const comments = document.createElement("div");
        comments.id = "comments-" + post.id;

        const form = document.createElement("div");
        form.className = "comment-form";

        const commentInput = document.createElement("input");
        commentInput.type = "text";
        commentInput.maxLength = 1000;
        commentInput.placeholder = "댓글을 입력하세요.";

        const passwordInput = document.createElement("input");
        passwordInput.type = "password";
        passwordInput.maxLength = 100;
        passwordInput.placeholder = "댓글 삭제 비밀번호 (4자리 이상)";

        const commentButton = document.createElement("button");
        commentButton.textContent = "댓글 등록";

        commentButton.addEventListener("click", async () => {
            const text = commentInput.value.trim();
            const password = passwordInput.value;

            if (!text) {
                alert("댓글 내용을 입력해주세요.");
                return;
            }

            if (password.length < 4) {
                alert("삭제 비밀번호는 4자리 이상 입력해주세요.");
                return;
            }

            commentButton.disabled = true;

            const { error } = await db.rpc("create_comment", {
                p_confession_id: post.id,
                p_content: text,
                p_password: password
            });

            commentButton.disabled = false;

            if (error) {
                console.error(error);
                alert("댓글 등록에 실패했습니다: " + error.message);
                return;
            }

            commentInput.value = "";
            passwordInput.value = "";
            await loadComments(post.id);
        });

        form.append(commentInput, passwordInput, commentButton);
        commentArea.append(commentTitle, comments, form);

        card.append(top, content, deleteButton, commentArea);
        postList.appendChild(card);

        await loadComments(post.id);
    }
}

async function loadComments(postId) {
    const box = document.getElementById("comments-" + postId);
    if (!box) return;

    box.replaceChildren();

    const { data, error } = await db
        .from("confession_comments")
        .select("id,confession_id,content,created_at")
        .eq("confession_id", postId)
        .order("created_at", { ascending: true });

    if (error) {
        console.error(error);
        box.textContent = "댓글을 불러오지 못했습니다.";
        return;
    }

    if (!data || data.length === 0) {
        const empty = document.createElement("p");
        empty.className = "notice";
        empty.textContent = "첫 댓글을 남겨보세요.";
        box.appendChild(empty);
        return;
    }

    for (const item of data) {
        const row = document.createElement("div");
        row.className = "comment";

        const contentRow = document.createElement("div");
        contentRow.className = "comment-row";

        const text = document.createElement("div");
        text.className = "comment-text";
        text.textContent = "익명: " + escapeText(item.content);

        const button = document.createElement("button");
        button.className = "small-btn";
        button.textContent = "삭제";
        button.addEventListener("click", () => deleteComment(item.id, postId));

        contentRow.append(text, button);

        const date = document.createElement("div");
        date.className = "comment-date";
        date.textContent = formatDate(item.created_at);

        row.append(contentRow, date);
        box.appendChild(row);
    }
}

async function submitPost() {
    const target = document.getElementById("targetNickname").value.trim();
    const content = document.getElementById("postContent").value.trim();
    const password = document.getElementById("postPassword").value;
    const button = document.getElementById("postSubmit");

    if (!target || !content) {
        alert("상대방 닉네임과 고백 내용을 입력해주세요.");
        return;
    }

    if (password.length < 4) {
        alert("삭제 비밀번호는 4자리 이상 입력해주세요.");
        return;
    }

    button.disabled = true;

    const { error } = await db.rpc("create_confession", {
        p_target_nickname: target,
        p_content: content,
        p_password: password
    });

    button.disabled = false;

    if (error) {
        console.error(error);
        alert("게시글 등록에 실패했습니다: " + error.message);
        return;
    }

    document.getElementById("targetNickname").value = "";
    document.getElementById("postContent").value = "";
    document.getElementById("postPassword").value = "";

    alert("고백이 등록되었습니다 💗");
    await loadPosts();
}

async function deletePost(postId) {
    const password = prompt("게시글 작성 시 입력한 삭제 비밀번호를 입력하세요.");
    if (password === null) return;

    if (!password) {
        alert("비밀번호를 입력해주세요.");
        return;
    }

    const { data, error } = await db.rpc("delete_confession", {
        p_post_id: postId,
        p_password: password
    });

    if (error) {
        console.error(error);
        alert("게시글 삭제에 실패했습니다: " + error.message);
        return;
    }

    if (data === true) {
        alert("게시글이 삭제되었습니다.");
        await loadPosts();
    } else {
        alert("비밀번호가 맞지 않습니다.");
    }
}

async function deleteComment(commentId, postId) {
    const password = prompt("댓글 작성 시 입력한 삭제 비밀번호를 입력하세요.");
    if (password === null) return;

    if (!password) {
        alert("비밀번호를 입력해주세요.");
        return;
    }

    const { data, error } = await db.rpc("delete_comment", {
        p_comment_id: commentId,
        p_password: password
    });

    if (error) {
        console.error(error);
        alert("댓글 삭제에 실패했습니다: " + error.message);
        return;
    }

    if (data === true) {
        alert("댓글이 삭제되었습니다.");
        await loadComments(postId);
    } else {
        alert("비밀번호가 맞지 않습니다.");
    }
}

async function adminDeleteAll() {
    const confirmed = confirm(
        "정말 모든 게시글과 댓글을 삭제하시겠습니까?\n삭제 후 복구할 수 없습니다."
    );

    if (!confirmed) return;

    const password = prompt("운영자 마스터 비밀번호를 입력하세요.");
    if (password === null) return;

    if (!password) {
        alert("관리자 비밀번호를 입력해주세요.");
        return;
    }

    const { data, error } = await db.rpc("admin_delete_all", {
        p_password: password
    });

    if (error) {
        console.error(error);
        alert("삭제 요청에 실패했습니다: " + error.message);
        return;
    }

    if (data === true) {
        alert("모든 게시글과 댓글이 삭제되었습니다.");
        await loadPosts();
    } else {
        alert("관리자 비밀번호가 맞지 않습니다.");
    }
}

document.getElementById("postSubmit")
    .addEventListener("click", submitPost);

document.getElementById("adminDelete")
    .addEventListener("click", adminDeleteAll);

loadPosts();
</script>
</body>
</html>
