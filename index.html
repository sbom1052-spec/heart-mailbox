<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4050 김포/인천 싱글모임 비밀 고백게시판</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Pretendard:wght@300;400;500;600;700;800&display=swap');
:root{--rose:#a96f70;--rose-dark:#805354;--rose-soft:#c58e8d;--ink:#574747;--muted:#927d78;--gold:#c9a66b;--gold-light:#e8d7b7;--line:rgba(190,151,119,.42);--paper:rgba(255,252,248,.91);--shadow:0 8px 26px rgba(111,78,68,.09)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;}
body{font-family:"Pretendard",sans-serif;color:var(--ink);background:#f2d9d5 url("background_blossom_gold.png") center top/100% auto repeat-y fixed;}
.page{width:min(1080px,calc(100% - 40px));margin:0 auto;padding:0 0 30px;}
.hero{height:310px;width:100%;display:flex;align-items:flex-start;justify-content:center;text-align:center;padding:48px 16px 0;background:transparent;}
.hero-title-wrap{max-width:760px;padding:18px 30px 16px;border:0;border-radius:0;background:transparent;box-shadow:none;backdrop-filter:none}
.hero-kicker{margin:0 0 9px;color:#a27d69;font-size:12px;font-weight:700;letter-spacing:.22em}
.hero h1{margin:0;color:#87595a;font-family:"Noto Serif KR",serif;font-size:clamp(25px,4vw,39px);font-weight:600;letter-spacing:-.055em;line-height:1.35;text-shadow:0 1px 0 rgba(255,255,255,.65)}
.hero-subtitle{margin:10px 0 0;color:#8c6b66;font-family:"Noto Serif KR",serif;font-size:15px;letter-spacing:-.025em}
.composer{position:relative;height:auto;min-height:136px;margin:0 0 14px;padding:25px 30px 15px;background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);backdrop-filter:blur(8px)}
.composer::before{content:"✦ 마음 전하기";position:absolute;left:25px;top:-16px;min-width:125px;height:32px;padding:0 13px;background:linear-gradient(135deg,#bd8984,#9d6968);border:1px solid rgba(255,255,255,.65);border-radius:20px;color:#fffaf5;font-family:"Noto Serif KR",serif;font-size:13px;font-weight:600;letter-spacing:.02em;text-align:center;line-height:30px;box-shadow:0 3px 9px rgba(117,75,70,.15);z-index:2}
.composer-top{display:grid;grid-template-columns:115px minmax(0,275px) 190px;gap:12px;align-items:center;margin-bottom:10px}
.content-label{display:flex;align-items:center;margin:0}
.field-label{font-size:14px;font-weight:700;color:#896361;white-space:nowrap}
.field-label:before{content:"♡";color:#bd8984;font-size:18px;margin-right:7px}
#target,#postPassword{width:100%;min-width:0;height:38px;padding:8px 12px;border:1px solid #dfc9bd;border-radius:9px;background:rgba(255,255,255,.83);font:13px "Pretendard",sans-serif;color:var(--ink)}
.composer-bottom{display:grid;grid-template-columns:115px minmax(0,1fr) 140px;gap:12px;align-items:center}
#content{width:100%;height:48px;min-height:48px;resize:vertical;padding:11px 14px;border:1px solid #dfc9bd;border-radius:10px;background:rgba(255,255,255,.83);font:14px "Pretendard",sans-serif;line-height:1.55;color:var(--ink)}
input:focus,textarea:focus{outline:2px solid rgba(201,166,107,.24);border-color:#bd9180}
::placeholder{color:#b19d94}
.submit{height:58px;border:1px solid rgba(255,255,255,.7);border-radius:12px;background:linear-gradient(135deg,#bd8984,#956766);box-shadow:0 3px 0 #815a59;color:#fffaf6;font-size:15px;font-weight:700;letter-spacing:.02em;cursor:pointer}
.submit:hover{filter:brightness(1.04)}
button{font-family:inherit;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
.status{min-height:16px;margin-top:7px;text-align:center;color:#9b6965;font-size:12px}
.posts{display:grid;gap:11px}
.post{min-height:139px;display:grid;grid-template-columns:76px minmax(0,1fr);gap:16px;padding:16px 23px 13px;background:var(--paper);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow);backdrop-filter:blur(8px)}
.heart-count{width:68px;height:68px;margin-top:2px;border:1px solid #e7d2c4;border-radius:50%;background:linear-gradient(145deg,#fff9f4,#f2dfd8);display:flex;align-items:center;justify-content:center;color:#b77f7d;font-family:"Noto Serif KR",serif;font-size:29px;font-weight:500}
.post-main{min-width:0}
.post-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:1px 0 6px}
.target{font-family:"Noto Serif KR",serif;font-size:17px;font-weight:700;color:#805b59}
.date{font-size:11px;color:#a18d84;white-space:nowrap}
.post-content{white-space:pre-wrap;font-size:15px;line-height:1.7;margin:0 0 8px;color:#5f504c;overflow-wrap:anywhere}
.post-actions{text-align:right;margin-top:-3px}
.delete-button{border:0;background:transparent;color:#a28d85;font-size:11px;padding:3px 5px}
.admin-button{color:#986967}
.comments{margin:6px 0;padding:0;background:transparent}
.comment{padding:8px 0;border-bottom:1px solid rgba(201,166,107,.2)}
.comment:last-child{border:0}
.comment-top{display:flex;justify-content:space-between;color:#a17670;font-size:11px;margin-bottom:4px}
.comment-content{font-size:13px;line-height:1.6;white-space:pre-wrap;color:#645653;overflow-wrap:anywhere}
.comment-actions{text-align:right}
.comment-area{display:flex;align-items:center;gap:10px;min-width:0;margin-top:7px}
.comment-count{font-size:12px;color:#927d78;white-space:nowrap}
.comment-count:before{content:"♡";margin-right:5px;color:#b98780}
.comment-form{display:grid;grid-template-columns:minmax(0,1fr) 155px auto;gap:7px;flex:1;min-width:0}
.comment-form input{min-width:0;width:100%;height:35px;padding:8px 12px;border:1px solid #e2cfc4;border-radius:9px;background:rgba(255,255,255,.8);font:12px "Pretendard",sans-serif;color:var(--ink)}
.comment-form button{height:35px;padding:0 17px;border:0;border-radius:9px;background:#ad7b77;color:#fffaf6;font-size:12px;font-weight:700}
.empty{text-align:center;padding:35px;background:var(--paper);border:1px solid var(--line);border-radius:16px;color:#9c8179;line-height:1.8;box-shadow:var(--shadow)}
.footer{text-align:center;padding:19px 0 7px;color:#956d68;font:600 16px "Noto Serif KR",serif;letter-spacing:-.02em}
.admin-area{margin-top:10px;font-family:"Pretendard",sans-serif}
.admin-login{padding:5px;border:0;background:transparent;color:#a28d85;font-size:10px}
.admin-state{font-size:11px;color:#986967}
@media(max-width:700px){
 body{background-attachment:scroll;background-size:100% auto}
 .page{width:calc(100% - 24px)}
 .hero{height:235px;padding:36px 5px 0}
 .hero-title-wrap{padding:15px 13px 13px;border:0;border-radius:0;background:transparent;box-shadow:none;backdrop-filter:none}
 .hero-kicker{font-size:10px;letter-spacing:.16em}
 .hero h1{font-size:clamp(22px,6vw,30px)}
 .hero-subtitle{font-size:13px}
 .composer{padding:22px 14px 15px;min-height:0}
 .composer::before{left:13px;top:-15px;min-width:112px;height:30px;font-size:12px;line-height:28px}
 .composer-top{grid-template-columns:105px minmax(0,1fr);gap:8px;margin-bottom:9px}
 #target{width:100%}
 #postPassword{grid-column:2;width:175px;max-width:100%}
 .composer-bottom{grid-template-columns:105px minmax(0,1fr);gap:8px}
 .content-label{margin:0 0 1px}
 #content{height:58px;min-height:58px}
 .composer-bottom .submit{grid-column:1 / -1}
 .submit{height:48px}
 .post{grid-template-columns:52px minmax(0,1fr);gap:10px;padding:13px 12px;min-height:0}
 .heart-count{width:50px;height:50px;font-size:23px}
 .comment-area{flex-wrap:wrap}
 .comment-form{flex-basis:100%;grid-template-columns:minmax(0,1fr) 125px auto;gap:5px}
 .comment-form button{padding:0 12px}
}
@media(max-width:420px){.hero{height:220px}.post-head{align-items:flex-start;flex-direction:column;gap:3px}.post-content{font-size:14px}}
</style>
</head>
<body>
<main class="page">
  <header class="hero" aria-label="4050 김포 인천 싱글모임 비밀 고백게시판">
    <div class="hero-title-wrap">
      <p class="hero-kicker">4050 김포/인천 싱글모임</p>
      <h1>비밀 고백게시판</h1>
      <p class="hero-subtitle">마음속에만 담아두지 말고, 익명으로 솔직한 마음을 전해보세요 ♡</p>
    </div>
  </header>
  <section class="composer">
    <form id="confessionForm">
      <div class="composer-top">
        <label class="field-label" for="target">상대방 닉네임</label>
        <input id="target" type="text" maxlength="40" placeholder="상대방 닉네임" required>
        <input id="postPassword" type="password" minlength="4" maxlength="50" autocomplete="new-password" placeholder="비밀번호(4자 이상)" required aria-label="게시글 삭제 비밀번호">
      </div>
      <div class="composer-bottom">
        <label class="field-label content-label" for="content">고백 내용</label>
        <textarea id="content" maxlength="1500" placeholder="하고 싶은 말을 적어주세요... 💕" required></textarea>
        <button class="submit" id="submitButton" type="submit">✎ 등록하기</button>
      </div>
      <div class="status" id="formStatus" aria-live="polite"></div>
    </form>
  </section>
  <section id="postList" class="posts" aria-live="polite"><div class="empty">고백을 불러오고 있습니다...</div></section>
  <footer class="footer">
    💗 좋은 마음이 모여 더 따뜻한 모임이 되길 바라요 💗
    <div class="admin-area">
      <span id="adminState" class="admin-state"></span>
      <button id="adminDeleteAllButton" class="admin-login" type="button">관리자 전체 게시글·댓글 삭제</button>
    </div>
  </footer>
</main>
<script>
const SUPABASE_URL = "https://vuvzchrhbdgtsfjoobrb.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_E0GSkkS2vp-oknFC9nfvAg_Ky-JhpBH";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const postList = document.getElementById("postList");
const formStatus = document.getElementById("formStatus");

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[char]));
}
function formatDate(value) {
  return new Date(value).toLocaleString("ko-KR", {
    month:"long",day:"numeric",hour:"2-digit",minute:"2-digit"
  });
}

// 고백 등록: 닉네임 옆 비밀번호 입력란의 값을 함께 저장합니다.
document.getElementById("confessionForm").addEventListener("submit", async function(event) {
  event.preventDefault();
  const target = document.getElementById("target").value.trim();
  const content = document.getElementById("content").value.trim();
  const password = document.getElementById("postPassword").value;
  if (!target || !content || password.length < 4) {
    formStatus.textContent = "닉네임, 고백 내용과 비밀번호(4자 이상)를 입력해 주세요.";
    return;
  }
  const button = document.getElementById("submitButton");
  button.disabled = true;
  formStatus.textContent = "고백을 등록하고 있습니다...";
  try {
    const { error } = await db.rpc("create_confession", {
      p_target_nickname:target,p_content:content,p_password:password
    });
    if (error) throw error;
    this.reset();
    formStatus.textContent = "고백이 등록되었습니다. 💗";
    await loadPosts();
  } catch (error) {
    console.error(error);
    formStatus.textContent = "등록에 실패했습니다. Supabase 설정을 확인해 주세요.";
  } finally {
    button.disabled = false;
  }
});

async function loadPosts() {
  const { data:posts, error } = await db.from("confessions")
    .select("id,target_nickname,content,created_at")
    .order("created_at",{ascending:false}).limit(100);
  if (error) {
    console.error(error);
    postList.innerHTML = '<div class="empty">게시글을 불러오지 못했습니다.</div>';
    return;
  }
  if (!posts || posts.length === 0) {
    postList.innerHTML = '<div class="empty">아직 도착한 고백이 없어요.<br>첫 번째 마음을 전해보세요 💗</div>';
    return;
  }
  const ids = posts.map(p => p.id);
  const { data:comments, error:commentError } = await db.from("confession_comments")
    .select("id,confession_id,content,created_at")
    .in("confession_id",ids).order("created_at",{ascending:true});
  if (commentError) console.error(commentError);
  const safeComments = comments || [];

  postList.innerHTML = posts.map((post,index) => {
    const list = safeComments.filter(c => c.confession_id === post.id);
    return `
      <article class="post">
        <div class="heart-count">♡</div>
        <div class="post-main">
          <div class="post-head">
            <span class="target">${escapeHTML(post.target_nickname)}</span>
            <span class="date">◷ ${formatDate(post.created_at)}</span>
          </div>
          <p class="post-content">${escapeHTML(post.content)}</p>
          <div class="post-actions">
            <button class="delete-button" type="button" onclick="deletePost('${post.id}')">본인 삭제</button>
            
          </div>
          <div class="comments">
            ${list.map(c => `
              <div class="comment">
                <div class="comment-top"><span>익명</span><span>${formatDate(c.created_at)}</span></div>
                <div class="comment-content">${escapeHTML(c.content)}</div>
                <div class="comment-actions">
                  <button class="delete-button" type="button" onclick="deleteComment('${c.id}')">본인 삭제</button>
                  
                </div>
              </div>`).join("")}
          </div>
          <div class="comment-area">
            <span class="comment-count">댓글 ${list.length}개</span>
            <form class="comment-form" data-post-id="${post.id}">
              <input name="comment" maxlength="500" placeholder="댓글을 입력해보세요..." required>
              <input name="password" type="password" minlength="4" maxlength="50" autocomplete="new-password" placeholder="비밀번호(4자 이상)" required aria-label="댓글 삭제 비밀번호">
              <button type="submit">등록</button>
            </form>
          </div>
        </div>
      </article>`;
  }).join("");

  document.querySelectorAll(".comment-form").forEach(form => form.addEventListener("submit",addComment));
}

async function addComment(event) {
  event.preventDefault();
  const form = event.currentTarget;
  const content = form.elements.comment.value.trim();
  const password = form.elements.password.value;
  if (!content || password.length < 4) {
    alert("댓글과 비밀번호(4자 이상)를 입력해 주세요.");
    return;
  }
  const button = form.querySelector("button");
  button.disabled = true;
  try {
    const { error } = await db.rpc("create_comment", {
      p_confession_id:form.dataset.postId,p_content:content,p_password:password
    });
    if (error) throw error;
    await loadPosts();
  } catch(error) {
    console.error(error);
    alert("댓글 등록에 실패했습니다. 다시 시도해 주세요.");
    button.disabled = false;
  }
}

async function deletePost(postId) {
  const password = prompt("게시글 작성 시 설정한 삭제 비밀번호를 입력해 주세요.");
  if (password === null) return;
  if (!password) { alert("비밀번호를 입력해 주세요."); return; }
  if (!confirm("이 게시글과 댓글을 모두 삭제할까요?")) return;
  try {
    const { data,error } = await db.rpc("delete_confession",{p_post_id:postId,p_password:password});
    if (error) throw error;
    if (data !== true) { alert("비밀번호가 일치하지 않거나 삭제할 수 없는 게시글입니다."); return; }
    alert("게시글이 삭제되었습니다.");
    await loadPosts();
  } catch(error) {
    console.error(error);alert("게시글 삭제에 실패했습니다.");
  }
}

async function deleteComment(commentId) {
  const password = prompt("댓글 작성 시 설정한 삭제 비밀번호를 입력해 주세요.");
  if (password === null) return;
  if (!password) { alert("비밀번호를 입력해 주세요."); return; }
  if (!confirm("이 댓글을 삭제할까요?")) return;
  try {
    const { data,error } = await db.rpc("delete_comment",{p_comment_id:commentId,p_password:password});
    if (error) throw error;
    if (data !== true) { alert("비밀번호가 일치하지 않거나 삭제할 수 없는 댓글입니다."); return; }
    alert("댓글이 삭제되었습니다.");
    await loadPosts();
  } catch(error) {
    console.error(error);alert("댓글 삭제에 실패했습니다.");
  }
}

// 관리자 전체 삭제: SQL의 admin_delete_all(text) 함수를 직접 호출합니다.
document.getElementById("adminDeleteAllButton").addEventListener("click", async function() {
  const confirmed = confirm("정말 모든 게시글과 댓글을 삭제하시겠습니까?\n삭제 후 복구할 수 없습니다.");
  if (!confirmed) return;

  const password = prompt("Supabase에 설정한 관리자 마스터 비밀번호를 입력해 주세요.");
  if (password === null) return;
  if (!password) {
    alert("관리자 비밀번호를 입력해 주세요.");
    return;
  }

  const button = this;
  button.disabled = true;
  try {
    const { data, error } = await db.rpc("admin_delete_all", {
      p_password: password
    });

    if (error) {
      console.error("관리자 전체 삭제 오류:", error);
      alert(
        "전체 삭제에 실패했습니다.\n" +
        "오류 코드: " + (error.code || "없음") + "\n" +
        "오류 내용: " + (error.message || "알 수 없는 오류")
      );
      return;
    }

    if (data === true) {
      alert("모든 게시글과 댓글이 삭제되었습니다.");
      await loadPosts();
    } else {
      alert("관리자 비밀번호가 일치하지 않습니다.");
    }
  } catch (error) {
    console.error("관리자 전체 삭제 예외:", error);
    alert("관리자 전체 삭제 중 오류가 발생했습니다: " + error.message);
  } finally {
    button.disabled = false;
  }
});

loadPosts();
</script>
</body>
</html>
