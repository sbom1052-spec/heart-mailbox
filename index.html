<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리의 고백 게시판</title>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{--pink:#f45ca6;--deep:#a52c70;--ink:#302044;--muted:#91869e;--line:#ffc1df;}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;}
body{font-family:"Pretendard",sans-serif;color:var(--ink);background:#ffd9e9 url("love_banner_new.png") center top/cover fixed no-repeat;}
.page{width:min(1170px,calc(100% - 40px));margin:0 auto;padding:0 0 24px;}
/* 곰돌이와 하트가 있는 새 이미지는 페이지 전체 배경으로 사용합니다. */
.hero{height:240px;width:100vw;margin-left:calc((1170px - 100vw)/2);background:transparent;}
.composer{position:relative;height:auto;min-height:136px;margin:0 0 11px;padding:20px 30px 13px;background:rgba(255,255,255,.97);border:1.5px solid #ff9dce;border-radius:17px;box-shadow:0 3px 12px rgba(221,89,153,.12);}
.composer::before{content:"♥  고백하기";position:absolute;left:26px;top:-17px;width:108px;height:34px;padding:0;background:linear-gradient(135deg,#ff79b7 0%,#f34c9e 100%);border-radius:7px;color:#fff;font-size:14px;font-weight:800;letter-spacing:-.4px;text-align:center;line-height:34px;box-shadow:0 2px 5px rgba(221,89,153,.18);z-index:2;}
.composer-top{display:grid;grid-template-columns:105px minmax(0,275px) 175px;gap:12px;align-items:center;margin-bottom:9px;}
.content-label{display:flex;align-items:center;margin:0;}
.field-label{font-size:14px;font-weight:800;color:#8e245e;white-space:nowrap;}
.field-label:before{content:"♥";color:#f04e9b;font-size:17px;margin-right:7px;}
#target,#postPassword{width:100%;min-width:0;height:35px;padding:7px 11px;border:1px solid #cfc6d2;border-radius:6px;background:#fff;font:13px "Pretendard",sans-serif;color:var(--ink);}
.composer-bottom{display:grid;grid-template-columns:105px minmax(0,1fr) 130px;gap:12px;align-items:center;}
#content{width:100%;height:43px;min-height:43px;resize:vertical;padding:10px 14px;border:1.5px solid #ffadd3;border-radius:8px;background:#fff;font:14px "Pretendard",sans-serif;line-height:1.5;color:var(--ink);}
input:focus,textarea:focus{outline:2px solid #ffd0e6;border-color:#f45ca6;}
::placeholder{color:#a69aaa;}
.submit{height:60px;border:0;border-radius:13px;background:linear-gradient(135deg,#ff80bb,#f24d9d);box-shadow:0 3px 0 #e9a0c5;color:white;font-size:16px;font-weight:800;cursor:pointer;}
.submit:hover{filter:brightness(.97);}
button{font-family:inherit;cursor:pointer;}
button:disabled{opacity:.55;cursor:wait;}
.status{min-height:16px;margin-top:5px;text-align:center;color:#b52e70;font-size:12px;}
.posts{display:grid;gap:9px;}
.post{min-height:139px;display:grid;grid-template-columns:78px minmax(0,1fr);gap:16px;padding:14px 24px 11px;background:rgba(255,255,255,.98);border:1px solid #ffc0df;border-radius:16px;box-shadow:0 3px 12px rgba(215,105,157,.12);}
.heart-count{width:72px;height:72px;margin-top:1px;border-radius:50% 50% 48% 48%;background:#ffe0ef;display:flex;align-items:center;justify-content:center;color:#ed3994;font-size:27px;font-weight:900;}
.post-main{min-width:0;}
.post-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:1px 0 4px;}
.target{font-size:17px;font-weight:800;color:#38203e;}
.date{font-size:12px;color:#8f829c;white-space:nowrap;}
.post-content{white-space:pre-wrap;font-size:15px;line-height:1.55;margin:0 0 7px;overflow-wrap:anywhere;}
.post-actions{text-align:right;margin-top:-3px;}
.delete-button{border:0;background:transparent;color:#a99aaa;font-size:11px;padding:3px 5px;}
.admin-button{color:#bd347b;}
.comments{margin:5px 0 6px;padding:0;background:transparent;}
.comment{padding:7px 0;border-bottom:1px solid #f8e1ed;}
.comment:last-child{border:0;}
.comment-top{display:flex;justify-content:space-between;color:#9c3972;font-size:11px;margin-bottom:3px;}
.comment-content{font-size:12px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;}
.comment-actions{text-align:right;}
.comment-area{display:flex;align-items:center;gap:10px;min-width:0;margin-top:5px;}
.comment-count{font-size:12px;color:#8d8299;white-space:nowrap;}
.comment-count:before{content:"▣";margin-right:5px;}
.comment-form{display:grid;grid-template-columns:minmax(0,1fr) 155px auto;gap:6px;flex:1;min-width:0;}
.comment-form input{min-width:0;width:100%;height:33px;padding:7px 12px;border:1px solid #f5c4dc;border-radius:7px;background:#fff3f9;font:12px "Pretendard",sans-serif;}
.comment-form button{height:33px;padding:0 17px;border:0;border-radius:10px;background:#f66bab;color:white;font-size:12px;font-weight:800;}
.empty{text-align:center;padding:35px;background:#fff;border:1px solid #ffc0df;border-radius:16px;color:#9b7c91;}
.footer{text-align:center;padding:17px 0 5px;color:#c33b80;font:700 20px "Gaegu",cursive;}
.admin-area{margin-top:9px;font-family:"Pretendard",sans-serif;}
.admin-login{padding:5px;border:0;background:transparent;color:#a88b9b;font-size:10px;}
.admin-state{font-size:11px;color:#b52e70;}
@media(min-width:1171px){.hero{margin-left:calc((1170px - 100vw)/2);}}
@media(max-width:1170px){.hero{margin-left:-20px;width:100vw;}}
@media(max-width:700px){
 .page{width:calc(100% - 24px);}
 .hero{height:175px;margin-left:-12px;width:100vw;background:transparent;}
 .composer{padding:20px 14px 15px;min-height:0;}
 .composer::before{left:12px;top:-16px;width:104px;height:32px;padding:0;font-size:13px;line-height:32px;border-radius:7px;}
 .composer-top{grid-template-columns:105px minmax(0,1fr);gap:7px;margin-bottom:9px;}
 #target{width:100%;}
 #postPassword{grid-column:2;width:175px;max-width:100%;}
 .composer-bottom{grid-template-columns:105px minmax(0,1fr);gap:7px;}
 .composer-bottom .submit{grid-column:1 / -1;}
 .content-label{margin:0 0 1px;}
 #content{height:55px;min-height:55px;}
 .submit{height:48px;}
 .post{grid-template-columns:54px minmax(0,1fr);gap:10px;padding:13px 12px;min-height:0;}
 .heart-count{width:52px;height:52px;font-size:22px;}
 .comment-area{flex-wrap:wrap;}
 .comment-form{flex-basis:100%;grid-template-columns:minmax(0,1fr) 145px auto;}
}
@media(max-width:420px){.hero{height:145px;}.post-head{align-items:flex-start;flex-direction:column;gap:3px;}.post-content{font-size:14px;}}
</style>
</head>
<body>
<main class="page">
  <header class="hero" role="img" aria-label="곰돌이와 하트가 있는 핑크색 배경"></header>
  <section class="composer">
    <form id="confessionForm">
      <div class="composer-top">
        <label class="field-label" for="target">상대방 닉네임</label>
        <input id="target" type="text" maxlength="40" placeholder="상대방 닉네임" required>
        <input id="postPassword" type="password" minlength="4" maxlength="50" autocomplete="new-password" placeholder="비밀번호(4자 이상)" required aria-label="게시글 삭제 비밀번호">
      </div>
      <div class="composer-bottom">
        <label class="field-label content-label" for="content">고백 내용</label>
        <textarea id="content" maxlength="1500" placeholder="하고 싶은 말을 적어주세요... 💕" required></textarea>
        <button class="submit" id="submitButton" type="submit">✎ 등록하기</button>
      </div>
      <div class="status" id="formStatus" aria-live="polite"></div>
    </form>
  </section>
  <section id="postList" class="posts" aria-live="polite"><div class="empty">고백을 불러오고 있습니다...</div></section>
  <footer class="footer">
    💗 좋은 마음이 모여 더 따뜻한 모임이 되길 바라요 💗
    <div class="admin-area">
      <button id="adminDeleteAllButton" class="admin-login" type="button">운영자 전체 삭제</button>
    </div>
  </footer>
</main>
<script>
const SUPABASE_URL = "https://vuvzchrhbdgtsfjoobrb.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_E0GSkkS2vp-oknFC9nfvAg_Ky-JhpBH";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const postList = document.getElementById("postList");
const formStatus = document.getElementById("formStatus");
let isAdmin = false;
let adminPassword = "";

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[char]));
}
function formatDate(value) {
  return new Date(value).toLocaleString("ko-KR", {
    month:"long",day:"numeric",hour:"2-digit",minute:"2-digit"
  });
}

// 고백 등록: 닉네임 옆 비밀번호 입력란의 값을 함께 저장합니다.
document.getElementById("confessionForm").addEventListener("submit", async function(event) {
  event.preventDefault();
  const target = document.getElementById("target").value.trim();
  const content = document.getElementById("content").value.trim();
  const password = document.getElementById("postPassword").value;
  if (!target || !content || password.length < 4) {
    formStatus.textContent = "닉네임, 고백 내용과 비밀번호(4자 이상)를 입력해 주세요.";
    return;
  }
  const button = document.getElementById("submitButton");
  button.disabled = true;
  formStatus.textContent = "고백을 등록하고 있습니다...";
  try {
    const { error } = await db.rpc("create_confession", {
      p_target_nickname:target,p_content:content,p_password:password
    });
    if (error) throw error;
    this.reset();
    formStatus.textContent = "고백이 등록되었습니다. 💗";
    await loadPosts();
  } catch (error) {
    console.error(error);
    formStatus.textContent = "등록에 실패했습니다. Supabase 설정을 확인해 주세요.";
  } finally {
    button.disabled = false;
  }
});

async function loadPosts() {
  const { data:posts, error } = await db.from("confessions")
    .select("id,target_nickname,content,created_at")
    .order("created_at",{ascending:false}).limit(100);
  if (error) {
    console.error(error);
    postList.innerHTML = '<div class="empty">게시글을 불러오지 못했습니다.</div>';
    return;
  }
  if (!posts || posts.length === 0) {
    postList.innerHTML = '<div class="empty">아직 도착한 고백이 없어요.<br>첫 번째 마음을 전해보세요 💗</div>';
    return;
  }
  const ids = posts.map(p => p.id);
  const { data:comments, error:commentError } = await db.from("confession_comments")
    .select("id,confession_id,content,created_at")
    .in("confession_id",ids).order("created_at",{ascending:true});
  if (commentError) console.error(commentError);
  const safeComments = comments || [];

  postList.innerHTML = posts.map((post,index) => {
    const list = safeComments.filter(c => c.confession_id === post.id);
    return `
      <article class="post">
        <div class="heart-count">♡</div>
        <div class="post-main">
          <div class="post-head">
            <span class="target">${escapeHTML(post.target_nickname)}</span>
            <span class="date">◷ ${formatDate(post.created_at)}</span>
          </div>
          <p class="post-content">${escapeHTML(post.content)}</p>
          <div class="post-actions">
            <button class="delete-button" type="button" onclick="deletePost('${post.id}')">본인 삭제</button>
            ${isAdmin ? `<button class="delete-button admin-button" type="button" onclick="adminDelete('post','${post.id}')">관리자 삭제</button>` : ""}
          </div>
          <div class="comments">
            ${list.map(c => `
              <div class="comment">
                <div class="comment-top"><span>익명</span><span>${formatDate(c.created_at)}</span></div>
                <div class="comment-content">${escapeHTML(c.content)}</div>
                <div class="comment-actions">
                  <button class="delete-button" type="button" onclick="deleteComment('${c.id}')">본인 삭제</button>
                  ${isAdmin ? `<button class="delete-button admin-button" type="button" onclick="adminDelete('comment','${c.id}')">관리자 삭제</button>` : ""}
                </div>
              </div>`).join("")}
          </div>
          <div class="comment-area">
            <span class="comment-count">댓글 ${list.length}개</span>
            <form class="comment-form" data-post-id="${post.id}">
              <input name="comment" maxlength="500" placeholder="댓글을 입력해보세요..." required>
              <input name="password" type="password" minlength="4" maxlength="50" autocomplete="new-password" placeholder="비밀번호(4자 이상)" required aria-label="댓글 삭제 비밀번호">
              <button type="submit">등록</button>
            </form>
          </div>
        </div>
      </article>`;
  }).join("");

  document.querySelectorAll(".comment-form").forEach(form => form.addEventListener("submit",addComment));
}

async function addComment(event) {
  event.preventDefault();
  const form = event.currentTarget;
  const content = form.elements.comment.value.trim();
  const password = form.elements.password.value;
  if (!content || password.length < 4) {
    alert("댓글과 비밀번호(4자 이상)를 입력해 주세요.");
    return;
  }
  const button = form.querySelector("button");
  button.disabled = true;
  try {
    const { error } = await db.rpc("create_comment", {
      p_confession_id:form.dataset.postId,p_content:content,p_password:password
    });
    if (error) throw error;
    await loadPosts();
  } catch(error) {
    console.error(error);
    alert("댓글 등록에 실패했습니다. 다시 시도해 주세요.");
    button.disabled = false;
  }
}

async function deletePost(postId) {
  const password = prompt("게시글 작성 시 설정한 삭제 비밀번호를 입력해 주세요.");
  if (password === null) return;
  if (!password) { alert("비밀번호를 입력해 주세요."); return; }
  if (!confirm("이 게시글과 댓글을 모두 삭제할까요?")) return;
  try {
    const { data,error } = await db.rpc("delete_confession",{p_post_id:postId,p_password:password});
    if (error) throw error;
    if (data !== true) { alert("비밀번호가 일치하지 않거나 삭제할 수 없는 게시글입니다."); return; }
    alert("게시글이 삭제되었습니다.");
    await loadPosts();
  } catch(error) {
    console.error(error);alert("게시글 삭제에 실패했습니다.");
  }
}

async function deleteComment(commentId) {
  const password = prompt("댓글 작성 시 설정한 삭제 비밀번호를 입력해 주세요.");
  if (password === null) return;
  if (!password) { alert("비밀번호를 입력해 주세요."); return; }
  if (!confirm("이 댓글을 삭제할까요?")) return;
  try {
    const { data,error } = await db.rpc("delete_comment",{p_comment_id:commentId,p_password:password});
    if (error) throw error;
    if (data !== true) { alert("비밀번호가 일치하지 않거나 삭제할 수 없는 댓글입니다."); return; }
    alert("댓글이 삭제되었습니다.");
    await loadPosts();
  } catch(error) {
    console.error(error);alert("댓글 삭제에 실패했습니다.");
  }
}

document.getElementById("adminDeleteAllButton").addEventListener("click", async function() {
  if (!confirm("정말 모든 게시글과 댓글을 삭제하시겠습니까?\n삭제 후 복구할 수 없습니다.")) return;
  const password = prompt("운영자 마스터 비밀번호를 입력해 주세요.");
  if (password === null) return;
  if (!password) { alert("관리자 비밀번호를 입력해 주세요."); return; }
  const button = this;
  button.disabled = true;
  try {
    const { data, error } = await db.rpc("admin_delete_all", { p_password: password });
    if (error) throw error;
    if (data !== true) { alert("관리자 비밀번호가 맞지 않습니다."); return; }
    alert("모든 게시글과 댓글이 삭제되었습니다.");
    await loadPosts();
  } catch (error) {
    console.error(error);
    alert("전체 삭제에 실패했습니다. Supabase 함수와 권한을 확인해 주세요.");
  } finally {
    button.disabled = false;
  }
});
loadPosts();
</script>
</body>
</html>
